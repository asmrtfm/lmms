[project]
name = "lmms-mcp-sqlite"
version = "0.1.0"
description = "MCP server for managing LMMS projects (.lmms-db), presets, samples, and plugins via SQLite"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
lmms-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
